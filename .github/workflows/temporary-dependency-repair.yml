name: Temporary Lumyra frontend dependency repair
on:
  push:
    branches: [fix/security-quality-20261111]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-quality-20261111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update Axios and compatible transitive dependencies
        working-directory: frontend_web
        run: |
          npm install --save-exact axios@1.21.1 --ignore-scripts --no-fund
          npm audit fix --ignore-scripts --no-fund
      - name: Verify build, tests and production audit
        working-directory: frontend_web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend_web/package.json frontend_web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Axios and vulnerable frontend dependencies"
            git push origin HEAD:fix/security-quality-20261111
          fi
