name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python 3.11
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:///data/event_erp.sqlite3
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend components core db integrations migrations models pages repositories scripts services tests workers app.py public_app.py
      - run: python -m pytest -q

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
